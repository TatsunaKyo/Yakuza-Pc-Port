name: Windows PC port
on:
  push:
    branches: [iso-gz]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the Windows entry point
        run: |
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          $sources = (Get-ChildItem package/windows/*.cs).FullName
          & $compiler /nologo /target:winexe /platform:x64 /optimize+ "/out:$env:RUNNER_TEMP/Yakuza.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll $sources
      - name: Package the upstream V2 runtime
        run: |
          $url = 'https://github.com/IvanBarbosaFilho/Yakuza-Pc-Port/releases/download/V2.0.0/Yakuza-win64.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/upstream.zip"
          python tools/package_windows_gzip.py "$env:RUNNER_TEMP/upstream.zip" "$env:RUNNER_TEMP/Yakuza.exe" "$env:RUNNER_TEMP/Yakuza-Windows-ISO-GZ.zip"
      - name: Test gzip, runtime disc selection and desktop window layouts
        run: |
          python -m pip install pycdlib==1.14.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_windows_gzip.py "$env:RUNNER_TEMP/Yakuza-Windows-ISO-GZ.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Yakuza-Windows-ISO-GZ
          path: ${{ runner.temp }}/Yakuza-Windows-ISO-GZ.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: tested-windows-entry
          path: ${{ runner.temp }}/Yakuza.exe
